    <script>
        /* Web Audio Sound Synthesizer (No external audio file dependency) */
        const SoundEngine = {
            ctx: null,
            enabled: true,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playTick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.02);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.02);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.02);
            },

            playSuccess() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    const startTime = this.ctx.currentTime + idx * 0.08;
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.25);
                });
            },

            playWrong() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.25);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        };

        /**
         * Returns Japanese hiragana reading for given hours & minutes
         * Accurate Japanese time pronunciation rules
         */
        function getTimeInHiragana(hours, minutes) {
            const hourPronunciations = {
                1: 'いちじ', 2: 'にじ', 3: 'さんじ', 4: 'よじ', 5: 'ごじ',
                6: 'ろくじ', 7: 'しちじ', 8: 'はちじ', 9: 'くじ', 10: 'じゅうじ',
                11: 'じゅういちじ', 12: 'じゅうにじ', 0: 'じゅうにじ'
            };

            let h = hours % 12;
            if (h === 0) h = 12;

            const hourText = hourPronunciations[h] || `${h}じ`;

            if (minutes === 0) {
                return `${hourText} ちょうど`;
            }

            if (minutes === 30) {
                return `${hourText} はん`;
            }

            // Minute reading helper
            function getMinuteReading(m) {
                const tens = Math.floor(m / 10);
                const ones = m % 10;

                let tensStr = '';
                if (tens === 1) tensStr = 'じゅう';
                else if (tens === 2) tensStr = 'にじゅう';
                else if (tens === 3) tensStr = 'さんじゅう';
                else if (tens === 4) tensStr = 'よんじゅう';
                else if (tens === 5) tensStr = 'ごじゅう';

                const onesUnits = {
                    1: 'いっぷん', 2: 'にふん', 3: 'さんぷん', 4: 'よんぷん',
                    5: 'ごふん', 6: 'ろっぷん', 7: 'ななふん', 8: 'はっぷん',
                    9: 'きゅうふん', 0: 'っぷん'
                };

                if (ones === 0) {
                    if (tens === 1) return 'じゅっぷん';
                    return tensStr + 'っぷん';
                }

                return tensStr + onesUnits[ones];
            }

            return `${hourText} ${getMinuteReading(minutes)}`;
        }

        /* Speech Synthesis Engine */
        let voiceEnabled = true;

        function speakCurrentTime(customText) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Stop any pending speech

            let textToSpeak = customText;
            if (!textToSpeak) {
                if (currentTab === 'quiz') {
                    textToSpeak = 'とけいを よく みて、なんじか えらんでね！';
                } else {
                    textToSpeak = getTimeInHiragana(currentHours, currentMinutes);
                }
            }

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9; // Slightly slower for kids
            utterance.pitch = 1.1; // Friendly higher pitch
            window.speechSynthesis.speak(utterance);
        }

        /* App Global State */
        let currentTab = 'explore'; // 'explore', 'match', 'quiz', 'rewards'
        let currentHours = 3;
        let currentMinutes = 0;
        let starCount = 0;
        let soundEnabled = true;

        // Match Game State
        let matchDifficulty = 'easy'; // 'easy', 'medium', 'hard'
        let targetHours = 7;
        let targetMinutes = 0;

        // Quiz Game State
        let quizTargetHours = 9;
        let quizTargetMinutes = 0;

        // Stamp Rewards Collection
        const stamps = [
            { id: 1, emoji: '🐱', name: 'ねこちゃん', cost: 1, unlocked: false },
            { id: 2, emoji: '🐶', name: 'いぬくん', cost: 2, unlocked: false },
            { id: 3, emoji: '🚀', name: 'ロケット', cost: 3, unlocked: false },
            { id: 4, emoji: '🦄', name: 'ユニコーン', cost: 5, unlocked: false },
            { id: 5, emoji: '🍰', name: 'ケーキ', cost: 7, unlocked: false },
            { id: 6, emoji: '👑', name: 'おうかん', cost: 10, unlocked: false },
            { id: 7, emoji: '🌈', name: 'にじ', cost: 12, unlocked: false },
            { id: 8, emoji: '🤖', name: 'ロボット', cost: 15, unlocked: false },
            { id: 9, emoji: '🐼', name: 'パンダ', cost: 20, unlocked: false },
            { id: 10, emoji: '🦕', name: 'きょうりゅう', cost: 25, unlocked: false },
            { id: 11, emoji: '🛸', name: 'UFO', cost: 30, unlocked: false },
            { id: 12, emoji: '🏆', name: 'とけい はかせ', cost: 40, unlocked: false }
        ];

        /* SVG Clock Construction & Rendering */
        const clockSvg = document.getElementById('clockSvg');
        const hourSectorsG = document.getElementById('hourSectors');
        const minuteTicksG = document.getElementById('minuteTicks');
        const minuteNumbersG = document.getElementById('minuteNumbersGroup');
        const hourNumbersG = document.getElementById('hourNumbersGroup');
        const hourHandGroup = document.getElementById('hourHandGroup');
        const minuteHandGroup = document.getElementById('minuteHandGroup');

        // Color Palette for Hour Sectors
        const sectorColors = [
            '#FFE5EC', '#FFD6A5', '#FDFFB6', '#CAFFBF', 
            '#9BF6FF', '#A0C4FF', '#BDB2FF', '#FFC6FF',
            '#E2ECE9', '#FDE2E4', '#FFF1E6', '#E8E8E4'
        ];

        function initClockGraphics() {
            const center = 200;
            const radius = 175;

            // 1. Draw Hour Color Sectors (12 Pie Slices)
            hourSectorsG.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const startAngle = (i * 30 - 90) * (Math.PI / 180);
                const endAngle = ((i + 1) * 30 - 90) * (Math.PI / 180);

                const x1 = center + radius * Math.cos(startAngle);
                const y1 = center + radius * Math.sin(startAngle);
                const x2 = center + radius * Math.cos(endAngle);
                const y2 = center + radius * Math.sin(endAngle);

                const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;
                
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', sectorColors[i]);
                path.setAttribute('opacity', '0.65');
                hourSectorsG.appendChild(path);
            }

            // 2. Draw Minute Ticks & Numbers
            minuteTicksG.innerHTML = '';
            minuteNumbersG.innerHTML = '';

            for (let i = 0; i < 60; i++) {
                const angle = (i * 6 - 90) * (Math.PI / 180);
                const isMajor = (i % 5 === 0);
                
                const rInner = isMajor ? 162 : 168;
                const rOuter = 174;

                const x1 = center + rInner * Math.cos(angle);
                const y1 = center + rInner * Math.sin(angle);
                const x2 = center + rOuter * Math.cos(angle);
                const y2 = center + rOuter * Math.sin(angle);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', isMajor ? '#073B4C' : '#94A3B8');
                line.setAttribute('stroke-width', isMajor ? '3' : '1.5');
                minuteTicksG.appendChild(line);

                // Minute Labels (0, 5, 10, ... 55)
                if (isMajor) {
                    const rText = 152;
                    const tx = center + rText * Math.cos(angle);
                    const ty = center + rText * Math.sin(angle);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', tx);
                    text.setAttribute('y', ty + 4);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '11');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#0284C7');
                    text.textContent = i;
                    minuteNumbersG.appendChild(text);
                }
            }

            // 3. Draw Big Hour Numbers (1 - 12)
            hourNumbersG.innerHTML = '';
            for (let h = 1; h <= 12; h++) {
                const angle = (h * 30 - 90) * (Math.PI / 180);
                const rNum = 125;
                const nx = center + rNum * Math.cos(angle);
                const ny = center + rNum * Math.sin(angle);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', nx);
                text.setAttribute('y', ny + 9);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '26');
                text.setAttribute('font-weight', '800');
                text.setAttribute('fill', '#073B4C');
                text.textContent = h;
                hourNumbersG.appendChild(text);
            }
        }

        /**
         * Updates the visual rotation of the hands & text output
         */
        function updateClockDisplay() {
            // Minute Hand Rotation (360 degrees = 60 minutes)
            const minuteDeg = currentMinutes * 6;
            
            // Hour Hand Rotation (360 degrees = 12 hours -> 30 deg per hour + 0.5 deg per minute)
            const hourDeg = ((currentHours % 12) * 30) + (currentMinutes * 0.5);

            minuteHandGroup.setAttribute('transform', `rotate(${minuteDeg}, 200, 200)`);
            hourHandGroup.setAttribute('transform', `rotate(${hourDeg}, 200, 200)`);

            const digitalEl = document.getElementById('digitalDisplay');
            const hiraEl = document.getElementById('hiraganaReading');

            if (currentTab === 'quiz') {
                // クイズモードではデジタル表示と読みに答えを出さない
                digitalEl.textContent = '??:??';
                hiraEl.textContent = 'とけいを よく みてね！';
            } else {
                // Format Digital Display (03:05)
                const formattedH = String(currentHours).padStart(2, '0');
                const formattedM = String(currentMinutes).padStart(2, '0');
                digitalEl.textContent = `${formattedH}:${formattedM}`;
                hiraEl.textContent = getTimeInHiragana(currentHours, currentMinutes);
            }
        }

        function updateClockVisuals() {
            const showMin = document.getElementById('toggleMinuteNums').checked;
            const showZones = document.getElementById('toggleColorZones').checked;

            minuteNumbersG.style.opacity = showMin ? '1' : '0';
            hourSectorsG.style.opacity = showZones ? '0.65' : '0';
        }

        function setClockTime(hours, minutes) {
            currentHours = hours;
            currentMinutes = minutes;
            updateClockDisplay();
            SoundEngine.playTick();
        }

        /* Drag and Touch Mechanics for Clock Hands */
        let activeDraggingHand = null; // 'minute' or 'hour'

        function getAngleFromPointer(e) {
            const rect = clockSvg.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const x = clientX - (rect.left + rect.width / 2);
            const y = clientY - (rect.top + rect.height / 2);

            let rad = Math.atan2(y, x) + (Math.PI / 2);
            if (rad < 0) rad += 2 * Math.PI;

            return rad * (180 / Math.PI); // Angle in degrees (0..360)
        }

        function startDrag(e, handType) {
            if (currentTab === 'quiz') return; // In Quiz mode, hands are fixed
            e.preventDefault();
            activeDraggingHand = handType;
            SoundEngine.playTick();
        }

        function handleDragMove(e) {
            if (!activeDraggingHand) return;
            e.preventDefault();

            const angle = getAngleFromPointer(e);

            if (activeDraggingHand === 'minute') {
                // Minute hand movement
                let newMin = Math.round(angle / 6) % 60;
                if (newMin < 0) newMin += 60;

                // Handle continuous hour wrapping when crossing 12 o'clock
                if (currentMinutes >= 50 && newMin <= 10) {
                    currentHours = (currentHours % 12) + 1;
                } else if (currentMinutes <= 10 && newMin >= 50) {
                    currentHours = currentHours - 1 <= 0 ? 12 : currentHours - 1;
                }

                if (newMin !== currentMinutes) {
                    currentMinutes = newMin;
                    SoundEngine.playTick();
                }
            } else if (activeDraggingHand === 'hour') {
                // Hour hand movement
                let h = Math.floor(angle / 30);
                if (h === 0) h = 12;

                if (h !== currentHours) {
                    currentHours = h;
                    SoundEngine.playTick();
                }
            }

            updateClockDisplay();
        }

        function stopDrag() {
            if (activeDraggingHand) {
                activeDraggingHand = null;
                if (currentTab === 'explore') {
                    speakCurrentTime();
                }
            }
        }

        // Attach Mouse & Touch Listeners to Clock Hands
        minuteHandGroup.addEventListener('mousedown', (e) => startDrag(e, 'minute'));
        hourHandGroup.addEventListener('mousedown', (e) => startDrag(e, 'hour'));

        minuteHandGroup.addEventListener('touchstart', (e) => startDrag(e, 'minute'), { passive: false });
        hourHandGroup.addEventListener('touchstart', (e) => startDrag(e, 'hour'), { passive: false });

        window.addEventListener('mousemove', handleDragMove);
        window.addEventListener('touchmove', handleDragMove, { passive: false });

        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('touchend', stopDrag);

        /* Tab Switching Logic */
        function switchTab(tab) {
            currentTab = tab;
            SoundEngine.playTick();

            // Reset Tab UI
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-sky-500', 'text-white', 'shadow-sm');
                btn.classList.add('text-slate-600', 'hover:bg-slate-100');
            });

            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('bg-sky-500', 'text-white', 'shadow-sm');
            activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100');

            // Hide all game panels
            document.getElementById('quickPresetPanel').classList.add('hidden');
            document.getElementById('matchControls').classList.add('hidden');
            document.getElementById('quizControls').classList.add('hidden');
            document.getElementById('rewardsArea').classList.add('hidden');

            if (tab === 'explore') {
                document.getElementById('quickPresetPanel').classList.remove('hidden');
                document.getElementById('mascotIcon').textContent = '🦉';
                document.getElementById('promptText').textContent = 'はりを ひっぱって じかんを かえてみよう！';
                updateClockDisplay();
            } else if (tab === 'match') {
                document.getElementById('matchControls').classList.remove('hidden');
                document.getElementById('matchControls').classList.add('flex');
                setupNewMatchQuestion();
                updateClockDisplay();
            } else if (tab === 'quiz') {
                document.getElementById('quizControls').classList.remove('hidden');
                document.getElementById('quizControls').classList.add('flex');
                setupNewQuizQuestion();
            } else if (tab === 'rewards') {
                document.getElementById('rewardsArea').classList.remove('hidden');
                document.getElementById('rewardsArea').classList.add('flex');
                document.getElementById('mascotIcon').textContent = '🎁';
                document.getElementById('promptText').textContent = 'あつめた ★ で スタンプを ゲットしよう！';
                renderStampsGrid();
                updateClockDisplay();
            }
        }

        /* Mode 2: Match Clock Game (あわせよう) */
        function setMatchDifficulty(diff) {
            matchDifficulty = diff;
            ['easy', 'medium', 'hard'].forEach(d => {
                const btn = document.getElementById(`diff-${d}`);
                if (d === diff) {
                    btn.className = 'px-3 py-1 rounded-lg bg-white shadow-sm text-sky-600 font-bold';
                } else {
                    btn.className = 'px-3 py-1 rounded-lg text-slate-600 font-bold';
                }
            });
            setupNewMatchQuestion();
        }

        function setupNewMatchQuestion() {
            targetHours = Math.floor(Math.random() * 12) + 1;

            if (matchDifficulty === 'easy') {
                targetMinutes = 0;
            } else if (matchDifficulty === 'medium') {
                const opts = [0, 15, 30, 45];
                targetMinutes = opts[Math.floor(Math.random() * opts.length)];
            } else { // hard
                targetMinutes = Math.floor(Math.random() * 12) * 5;
            }

            // Set mascot text
            const targetHiragana = getTimeInHiragana(targetHours, targetMinutes);
            document.getElementById('mascotIcon').textContent = '🎯';
            document.getElementById('promptText').textContent = `「${targetHiragana}」 に とけいを あわせよう！`;

            speakCurrentTime(`「${targetHiragana}」に とけいを あわせてね`);
        }

        function checkMatchAnswer() {
            if (currentHours === targetHours && currentMinutes === targetMinutes) {
                // Correct!
                SoundEngine.playSuccess();
                triggerConfetti();
                addStars(1);

                document.getElementById('mascotIcon').textContent = '🎉';
                document.getElementById('promptText').textContent = 'だいせいかい！ すごいね！';
                speakCurrentTime('だいせいかい！すごいね！');

                setTimeout(() => {
                    setupNewMatchQuestion();
                }, 2200);
            } else {
                // Wrong
                SoundEngine.playWrong();
                document.getElementById('mascotIcon').textContent = '🤔';
                document.getElementById('promptText').textContent = 'もういちど たしかめてみよう！';
                speakCurrentTime('もういちど たしかめてみよう！');
            }
        }

        /* Mode 3: Quiz Read Clock Game (なんじかな？) */
        function setupNewQuizQuestion() {
            quizTargetHours = Math.floor(Math.random() * 12) + 1;
            const minuteChoices = [0, 15, 30, 45];
            quizTargetMinutes = minuteChoices[Math.floor(Math.random() * minuteChoices.length)];

            // Set Clock Hands
            currentHours = quizTargetHours;
            currentMinutes = quizTargetMinutes;
            updateClockDisplay();

            document.getElementById('mascotIcon').textContent = '❓';
            document.getElementById('promptText').textContent = 'とけいは なんじを さしているかな？';

            // Generate 4 Multiple Choice Options
            const grid = document.getElementById('quizOptionsGrid');
            grid.innerHTML = '';

            const correctOption = { h: quizTargetHours, m: quizTargetMinutes };
            const options = [correctOption];

            // Generate 3 wrong options
            while (options.length < 4) {
                let hRand = Math.floor(Math.random() * 12) + 1;
                let mRand = minuteChoices[Math.floor(Math.random() * minuteChoices.length)];
                if (!options.some(o => o.h === hRand && o.m === mRand)) {
                    options.push({ h: hRand, m: mRand });
                }
            }

            // Shuffle Options
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-sky-50 hover:bg-sky-100 active:scale-95 border-2 border-sky-200 text-sky-800 font-extrabold text-lg sm:text-xl py-3 rounded-2xl shadow-sm transition flex flex-col items-center justify-center';
                
                const timeFormatted = `${String(opt.h).padStart(2, '0')}:${String(opt.m).padStart(2, '0')}`;
                const hira = getTimeInHiragana(opt.h, opt.m);

                btn.innerHTML = `
                    <span>${timeFormatted}</span>
                    <span class="text-xs font-bold text-sky-600">${hira}</span>
                `;

                btn.onclick = () => handleQuizAnswer(opt.h, opt.m, btn);
                grid.appendChild(btn);
            });
        }

        function handleQuizAnswer(selectedH, selectedM, btnEl) {
            if (selectedH === quizTargetHours && selectedM === quizTargetMinutes) {
                // Correct
                btnEl.classList.remove('bg-sky-50', 'border-sky-200');
                btnEl.classList.add('bg-emerald-500', 'border-emerald-600', 'text-white');

                // 正解時にデジタル時計とひらがな読みを公開
                const formattedH = String(quizTargetHours).padStart(2, '0');
                const formattedM = String(quizTargetMinutes).padStart(2, '0');
                document.getElementById('digitalDisplay').textContent = `${formattedH}:${formattedM}`;
                document.getElementById('hiraganaReading').textContent = getTimeInHiragana(quizTargetHours, quizTargetMinutes);

                SoundEngine.playSuccess();
                triggerConfetti();
                addStars(1);

                document.getElementById('mascotIcon').textContent = '👑';
                document.getElementById('promptText').textContent = 'せいかい！ てんさい！';
                speakCurrentTime('せいかい！てんさい！');

                setTimeout(() => {
                    setupNewQuizQuestion();
                }, 2000);
            } else {
                // Wrong
                btnEl.classList.remove('bg-sky-50', 'border-sky-200');
                btnEl.classList.add('bg-rose-100', 'border-rose-300', 'text-rose-600');

                SoundEngine.playWrong();
                document.getElementById('mascotIcon').textContent = '😅';
                document.getElementById('promptText').textContent = 'ちがうよ！ もういちど えらんでね！';
            }
        }

        /* Star & Reward Stamp System */
        function addStars(num) {
            starCount += num;
            document.getElementById('starCountDisplay').textContent = starCount;
            // Pop animation on star box
            const starBox = document.getElementById('starCountDisplay').parentElement;
            starBox.classList.add('pop-in');
            setTimeout(() => starBox.classList.remove('pop-in'), 300);
        }

        function renderStampsGrid() {
            const grid = document.getElementById('stampsGrid');
            grid.innerHTML = '';

            stamps.forEach(stamp => {
                const card = document.createElement('div');
                const isUnlocked = stamp.unlocked || starCount >= stamp.cost;

                card.className = `p-3 rounded-2xl flex flex-col items-center justify-center border-2 transition ${
                    stamp.unlocked
                        ? 'bg-amber-50 border-amber-300 shadow-md'
                        : isUnlocked
                        ? 'bg-emerald-50 border-emerald-300 cursor-pointer animate-pulse'
                        : 'bg-slate-100 border-slate-200 opacity-60'
                }`;

                card.innerHTML = `
                    <div class="text-3xl mb-1">${stamp.unlocked ? stamp.emoji : (isUnlocked ? '🎁' : '🔒')}</div>
                    <div class="text-xs font-black text-slate-700">${stamp.name}</div>
                    <div class="text-[10px] font-bold ${stamp.unlocked ? 'text-amber-600' : 'text-slate-500'} mt-1">
                        ${stamp.unlocked ? 'ゲット！' : `★ ${stamp.cost}`}
                    </div>
                `;

                if (!stamp.unlocked && isUnlocked) {
                    card.onclick = () => unlockStamp(stamp);
                }

                grid.appendChild(card);
            });
        }

        function unlockStamp(stamp) {
            stamp.unlocked = true;
            SoundEngine.playSuccess();
            triggerConfetti();
            renderStampsGrid();
        }

        /* Lightweight Self-contained Canvas Confetti */
        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FF6B8B', '#FFD166', '#06D6A0', '#118AB2', '#8338EC'];

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.8) * 12,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.3; // Gravity
                    p.alpha -= p.decay;

                    if (p.alpha > 0) {
                        alive = true;
                        ctx.save();
                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateConfetti();
        }

        /* Audio & Sound Toggle Handlers */
        function toggleVoice() {
            voiceEnabled = !voiceEnabled;
            document.getElementById('voiceIcon').textContent = voiceEnabled ? '🔊' : '🔇';
            document.getElementById('voiceToggleBtn').classList.toggle('bg-slate-200');
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            SoundEngine.enabled = soundEnabled;
            document.getElementById('soundIcon').textContent = soundEnabled ? '🎵' : '🔇';
            document.getElementById('soundToggleBtn').classList.toggle('bg-slate-200');
        }

        /* Initialize Application */
        window.onload = function() {
            initClockGraphics();
            updateClockDisplay();
            updateClockVisuals();

            // Initial friendly prompt
            speakCurrentTime('とけい マスターへ ようこそ！ はりを うごかしてみよう！');
        };
    </script>
</body>
