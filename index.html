<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしい！とけい マスター ✨ - 時計の読み方学習アプリ</title>
    
    <!-- Tailwind CSS CDN -->

    <!-- Google Fonts for friendly Japanese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#FF6B8B',
                            yellow: '#FFD166',
                            green: '#06D6A0',
                            blue: '#118AB2',
                            purple: '#8338EC',
                            dark: '#073B4C'
                        }
                    },
                    fontFamily: {
                        rounded: ['"M PLUS Rounded 1c"', '"Kiwi Maru"', 'sans-serif']

    </script>

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;

            touch-action: manipulation;
        }

        .clock-shadow {
            filter: drop-shadow(0px 12px 24px rgba(7, 59, 76, 0.15));
        }

        .hand-grab {
            cursor: grab;
        }
        .hand-grab:active {
            cursor: grabbing;
        }

        .bounce-gentle {
            animation: bounceGentle 2s infinite ease-in-out;
        }

        @keyframes bounceGentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }

        /* Canvas Overlay for Confetti Particles */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col min-h-screen pb-10">

                </div>
            </div>

            <div class="flex items-center space-x-2 md:space-x-4">
                <!-- Stars Counter -->
                <div class="bg-amber-100 border-2 border-amber-300 text-amber-900 px-3 py-1 rounded-full text-sm md:text-base font-black flex items-center shadow-inner">
                    <span class="text-xl mr-1">⭐</span>

    <main class="max-w-4xl mx-auto w-full px-4 pt-4 flex-grow flex flex-col">

                    <svg id="clockSvg" class="w-full h-full clock-shadow overflow-visible" viewBox="0 0 400 400">

                <div class="flex flex-col items-center justify-center space-y-4 w-full max-w-xs">

                            <button onclick="setClockTime(12, 0, false)" class="bg-amber-50 hover:bg-amber-100 text-amber-800 py-1.5 rounded-xl font-bold text-xs border border-amber-200">☀️ ひる 12:00</button>
                            <button onclick="setClockTime(3, 0, true)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-800 py-1.5 rounded-xl font-bold text-xs border border-indigo-200">🌙 15:00 (午後3時)</button>
                            <button onclick="setClockTime(7, 30, true)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-800 py-1.5 rounded-xl font-bold text-xs border border-indigo-200">🌙 19:30 (午後7時半)</button>

                    </h3>
                    <p class="text-xs text-slate-500 mb-4">もんだいに せいかいして ★ をあつめると スタンプがもらえるよ！</p>

    <script>
        let voiceEnabled = true;
        let currentTab = 'explore';
        let totalMinutes = 3 * 60; // 24時間の通算分 (0〜1439分)
        let currentHours = 3;
        let currentMinutes = 0;
        let isPM = false;
        let prevDragAngle = 0;
        let starCount = 0;

        let matchDifficulty = 'easy';
        let targetHours = 7;
        let targetMinutes = 0;
        let targetIsPM = false;

        let quizTargetHours = 9;
        let quizTargetMinutes = 0;
        let quizTargetIsPM = false;

        let isDraggingHour = false;
        let isDraggingMinute = false;

        const stamps = [
            { id: 1, emoji: '🐱', name: 'ねこちゃん', cost: 1, unlocked: false },
            { id: 2, emoji: '🐶', name: 'いぬくん', cost: 2, unlocked: false },
            { id: 3, emoji: '🚀', name: 'ロケット', cost: 3, unlocked: false },
            { id: 4, emoji: '🦄', name: 'ユニコーン', cost: 5, unlocked: false },
            { id: 5, emoji: '🍰', name: 'ケーキ', cost: 7, unlocked: false },
            { id: 6, emoji: '👑', name: 'おうかん', cost: 10, unlocked: false },
            { id: 7, emoji: '🌈', name: 'にじ', cost: 12, unlocked: false },
            { id: 8, emoji: '🤖', name: 'ロボット', cost: 15, unlocked: false },
            { id: 9, emoji: '🐼', name: 'パンダ', cost: 20, unlocked: false },
            { id: 10, emoji: '🦕', name: 'きょうりゅう', cost: 25, unlocked: false },
            { id: 11, emoji: '🛸', name: 'UFO', cost: 30, unlocked: false },
            { id: 12, emoji: '🏆', name: 'とけい はかせ', cost: 40, unlocked: false }
        ];

        const SoundEngine = {
            ctx: null,
            enabled: true,

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playTick() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.02);

                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.02);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.02);
            },

            playSuccess() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    const startTime = this.ctx.currentTime + idx * 0.08;
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.25);
                });
            },

            playWrong() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.25);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        };

        function getTimeInHiragana(hours, minutes, pm = isPM) {
            const hourPronunciations = {
                1: 'いちじ', 2: 'にじ', 3: 'さんじ', 4: 'よじ', 5: 'ごじ',
                6: 'ろくじ', 7: 'しちじ', 8: 'はちじ', 9: 'くじ', 10: 'じゅうじ',
                11: 'じゅういちじ', 12: 'じゅうにじ', 0: 'じゅうにじ'
            };

            let h = hours % 12;
            if (h === 0) h = 12;

            const hourText = hourPronunciations[h] || `${h}じ`;
            const amPmStr = pm ? 'ごご' : 'ごぜん';

            let h24 = hours;
            if (pm) {
                h24 = hours === 12 ? 12 : hours + 12;
            } else {
                h24 = hours === 12 ? 0 : hours;
            }

            function getMinuteReading(m) {
                const tens = Math.floor(m / 10);
                const ones = m % 10;

                let tensStr = '';
                if (tens === 1) tensStr = 'じゅう';
                else if (tens === 2) tensStr = 'にじゅう';
                else if (tens === 3) tensStr = 'さんじゅう';
                else if (tens === 4) tensStr = 'よんじゅう';
                else if (tens === 5) tensStr = 'ごじゅう';

                const onesUnits = {
                    1: 'いっぷん', 2: 'にふん', 3: 'さんぷん', 4: 'よんぷん',
                    5: 'ごふん', 6: 'ろっぷん', 7: 'ななふん', 8: 'はっぷん',
                    9: 'きゅうふん', 0: 'っぷん'
                };

                if (ones === 0) {
                    if (tens === 1) return 'じゅっぷん';
                    return tensStr + 'っぷん';
                }

                return tensStr + onesUnits[ones];
            }

            let minStr = '';
            if (minutes === 0) minStr = 'ちょうど';
            else if (minutes === 30) minStr = 'はん';
            else minStr = getMinuteReading(minutes);

            return `${amPmStr} ${hourText} ${minStr}（${h24}じ ${minStr}）`;
        }

        function speakCurrentTime(customText) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            let textToSpeak = customText;
            if (!textToSpeak) {

        const sectorColors = [

            '#E2ECE9', '#FDE2E4', '#FFF1E6', '#E8E8E4'

        function initClockGraphics() {
            const center = 200;
            const radius = 175;

            const hourSectorsG = document.getElementById('hourSectors');
            const minuteTicksG = document.getElementById('minuteTicks');
            const minuteNumbersG = document.getElementById('minuteNumbersGroup');
            const hourNumbersG = document.getElementById('hourNumbersGroup');
            const hour24NumbersG = document.getElementById('hour24NumbersGroup');

            if (!hourSectorsG) return;

            // 1. Hour Sectors
            hourSectorsG.innerHTML = '';
            for (let i = 0; i < 12; i++) {
                const startAngle = (i * 30 - 90) * (Math.PI / 180);
                const endAngle = ((i + 1) * 30 - 90) * (Math.PI / 180);

                const x1 = center + radius * Math.cos(startAngle);
                const y1 = center + radius * Math.sin(startAngle);
                const x2 = center + radius * Math.cos(endAngle);
                const y2 = center + radius * Math.sin(endAngle);

                const pathData = `M ${center} ${center} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;
                
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathData);
                path.setAttribute('fill', sectorColors[i]);
                path.setAttribute('opacity', '0.65');
                hourSectorsG.appendChild(path);
            }

            // 2. Minute Ticks & Numbers
            minuteTicksG.innerHTML = '';
            minuteNumbersG.innerHTML = '';

            for (let i = 0; i < 60; i++) {
                const angle = (i * 6 - 90) * (Math.PI / 180);
                const isMajor = (i % 5 === 0);
                
                const rInner = isMajor ? 162 : 168;
                const rOuter = 174;

                const x1 = center + rInner * Math.cos(angle);
                const y1 = center + rInner * Math.sin(angle);
                const x2 = center + rOuter * Math.cos(angle);
                const y2 = center + rOuter * Math.sin(angle);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', isMajor ? '#073B4C' : '#94A3B8');
                line.setAttribute('stroke-width', isMajor ? '3' : '1.5');
                minuteTicksG.appendChild(line);

                if (isMajor) {
                    const rText = 152;
                    const tx = center + rText * Math.cos(angle);
                    const ty = center + rText * Math.sin(angle);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', tx);
                    text.setAttribute('y', ty + 4);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '11');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', '#0284C7');
                    text.textContent = i;
                    minuteNumbersG.appendChild(text);
                }
            }

            // 3. Hour Main Numbers (1-12)
            hourNumbersG.innerHTML = '';
            for (let h = 1; h <= 12; h++) {
                const angle = (h * 30 - 90) * (Math.PI / 180);
                const rNum = 125;
                const nx = center + rNum * Math.cos(angle);
                const ny = center + rNum * Math.sin(angle);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', nx);
                text.setAttribute('y', ny + 9);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '26');
                text.setAttribute('font-weight', '800');
                text.setAttribute('fill', '#073B4C');
                text.textContent = h;
                hourNumbersG.appendChild(text);
            }

            // 4. 24-Hour Helper Numbers (13-24)
            hour24NumbersG.innerHTML = '';
            for (let h = 1; h <= 12; h++) {
                const angle = (h * 30 - 90) * (Math.PI / 180);
                const rNum24 = 88;
                const nx = center + rNum24 * Math.cos(angle);
                const ny = center + rNum24 * Math.sin(angle);

                const h24 = h === 12 ? 24 : h + 12;

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', nx);
                text.setAttribute('y', ny + 4);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-size', '13');
                text.setAttribute('font-weight', '800');
                text.setAttribute('fill', '#8338EC');
                text.textContent = h24;
                hour24NumbersG.appendChild(text);
            }
        }

        function setAmPm(pm) {

        function syncFromTotalMinutes() {
            // 0〜1439分の範囲にループ（24時間管理）
            totalMinutes = ((totalMinutes % 1440) + 1440) % 1440;
            
            const wasPM = isPM;
            // 720分 (12:00) 以上なら PM (ごご)
            isPM = totalMinutes >= 720;
            
            let h24 = Math.floor(totalMinutes / 60);
            currentHours = h24 % 12;
            if (currentHours === 0) currentHours = 12;
            currentMinutes = Math.floor(totalMinutes % 60);

            // ドラッグ中に午前/午後は切り替わった場合、効果音で通知
            if (wasPM !== isPM && (isDraggingHour || isDraggingMinute)) {
                SoundEngine.playTick();

            updateClockDisplay();

        function setClockTime(hours, minutes, pm = false) {
            let h12 = hours % 12;
            totalMinutes = (pm ? h12 + 12 : h12) * 60 + minutes;
            syncFromTotalMinutes();
            SoundEngine.playTick();
        }

        function getClockAngle(e) {
            const clockSvg = document.getElementById('clockSvg');
            const rect = clockSvg.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - (rect.left + rect.width / 2);
            const y = clientY - (rect.top + rect.height / 2);
            let rad = Math.atan2(y, x);
            let deg = rad * (180 / Math.PI) + 90;
            if (deg < 0) deg += 360;
            return deg;
        }

        function startDragHour(e) {
            e.preventDefault();
            isDraggingHour = true;
            prevDragAngle = getClockAngle(e);
            SoundEngine.init();
        }

        function startDragMinute(e) {
            e.preventDefault();
            isDraggingMinute = true;
            prevDragAngle = getClockAngle(e);
            SoundEngine.init();
        }

        function handleDragMove(e) {
            if (!isDraggingHour && !isDraggingMinute) return;
            e.preventDefault();

            const deg = getClockAngle(e);
            let delta = deg - prevDragAngle;

            // 12時（360度 / 0度）の境界線を跨いだ場合の角度補正
            if (delta < -180) delta += 360;
            if (delta > 180) delta -= 360;

            prevDragAngle = deg;

            if (isDraggingMinute) {
                // 長針: 360度 = 60分 (6度 = 1分)
                let deltaMins = delta / 6;
                totalMinutes += deltaMins;
                syncFromTotalMinutes();
            } else if (isDraggingHour) {
                // 短針: 360度 = 720分 (12時間, 1度 = 2分)
                let deltaMins = delta * 2;
                totalMinutes += deltaMins;
                syncFromTotalMinutes();
            }
        }

        function stopDrag() {
            if (isDraggingHour || isDraggingMinute) {
                isDraggingHour = false;
                isDraggingMinute = false;
                // 離した時に最も近い整数の「分」にスナップ
                totalMinutes = Math.round(totalMinutes);
                syncFromTotalMinutes();
                if (currentTab === 'explore') {
                    speakCurrentTime();
                }
            }
        }

        function triggerConfetti() {
            const canvas = document.getElementById('confettiCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#FF6B8B', '#FFD166', '#06D6A0', '#118AB2', '#8338EC'];

            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.7) * 12,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 0.02;

                    if (p.life > 0) {
                        alive = true;
                        ctx.globalAlpha = p.life;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateConfetti();
        }

                minuteHandGroup.addEventListener('touchstart', startDragMinute, { passive: false });
            }

            window.addEventListener('mousemove', handleDragMove);
            window.addEventListener('touchmove', handleDragMove, { passive: false });
            window.addEventListener('mouseup', stopDrag);
            window.addEventListener('touchend', stopDrag);
        });
    </script>
